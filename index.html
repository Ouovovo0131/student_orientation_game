<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      字型改成非阻塞載入。原本是一般的 stylesheet，瀏覽器必須等 Google 的伺服器
      回應才會畫出第一個像素 —— 訊號差的地方連下面的「載入中」都會被它擋住。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="preload"
      as="style"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>新生闖關活動</title>
  </head>
  <body>
    <!--
      JS 還在下載時就先讓螢幕上有東西。程式包接近 250 KB（gzip 後），校園裡訊號
      差的角落可能要十幾秒，在那之前 #root 是空的 —— 使用者看到的就是一片全白，
      沒有任何提示，會以為壞掉。React 掛載時會把這段內容換掉。
    -->
    <div id="root">
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif; padding: 24px; text-align: center; color: #101014;">
        <div style="margin: 48px auto 0; max-width: 320px; border: 4px solid #101014; background: #FFF6D6; padding: 20px;">
          <p style="margin: 0 0 8px; font-size: 18px; font-weight: 800;">新生闖關</p>
          <p style="margin: 0; font-size: 15px; font-weight: 700;">載入中，請稍候…</p>
          <p id="boot-hint" style="margin: 12px 0 0; font-size: 13px; line-height: 1.6;">
            如果一直停在這裡，代表現在的訊號比較弱。<br />
            請往走廊或窗邊移動，或改用行動網路再試一次。
          </p>
        </div>
      </div>
    </div>
    <!--
      等太久就換一段更明確的說法。React 一掛載就會把整個 #root 換掉，所以這段
      文字只有在「程式包始終沒跑起來」的時候才看得到 —— 那正是現場最需要知道
      該怎麼辦的時刻（訊號太弱、或用了掃描 App 的內建瀏覽器）。
    -->
    <script>
      setTimeout(function () {
        var hint = document.getElementById("boot-hint");
        if (!hint) return;
        hint.innerHTML =
          "載入時間比平常久。<br />請確認訊號，或點右上角選單改用 Safari／Chrome 開啟這個網址。";
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
